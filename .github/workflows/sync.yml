name: Sync Fork
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config --global user.name "looplaps"
          git config --global user.email "87746958+looplaps@users.noreply.github.com"
          git remote add upstream https://github.com/jonssonyan/h-ui.git || git remote set-url upstream https://github.com/jonssonyan/h-ui.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit || true
          git push origin main
